# =============================================================================
# JURIDICO-PLATFORM - Docker Compose Principal
# Inclui todos os serviços: infra base + monitoring + ingest + produtos
# =============================================================================

include:
  - docker/compose/base.yml
  - docker/compose/gateway.yml
  - docker/compose/monitoring.yml
  - docker/compose/ingest.yml
  - docker/compose/fiscal.yml
  - docker/compose/ollama.yml
  - docker/compose/traefik.yml
  - docker/compose/frontend.yml

# Declaração idêntica à dos arquivos incluídos — o Compose rejeita o include
# quando a mesma rede é redefinida com config divergente (o antigo bloco ipam
# com subnet fixa causava "conflicts with imported resource" no CI; nenhum
# serviço usa IP estático).
networks:
  juridico-net:
    driver: bridge

volumes:
  pg_data:
  neo4j_data:
  neo4j_logs:
  opensearch_data:
  redis_data:
  minio_data:
  chromadb_data:
  traefik_acme:
  prometheus_data:
  grafana_data:
  loki_data:
  ollama_data:
